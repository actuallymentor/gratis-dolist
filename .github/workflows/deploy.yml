name: Deploy

# Every push to main ships to https://dolist.gratis.sh
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Never run two deploys at once; the newest push wins
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dolist.gratis.sh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build static site
        run: node scripts/build.mjs

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.168.0"
          command: deploy
